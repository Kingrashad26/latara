name: Latara – backup flatten before the bell

on:
  schedule:
    # ~3:50pm ET in both EST and EDT (the wrong slot exits on its own)
    - cron: "50 19 * * 1-5"
    - cron: "50 20 * * 1-5"
  workflow_dispatch: {}

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m latara flatten
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          LATARA_MODE: ${{ vars.LATARA_MODE }}
          LATARA_CONFIRM_LIVE: ${{ vars.LATARA_CONFIRM_LIVE }}
