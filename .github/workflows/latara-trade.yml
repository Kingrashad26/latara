name: Latara – trading day

on:
  schedule:
    # GitHub cron is UTC. Two slots cover both EST and EDT; Latara exits
    # immediately from whichever slot is wrong for the season.
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: latara-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HAS_MAIL: ${{ secrets.GMAIL_APP_PASSWORD != '' && secrets.LATARA_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Latara
        id: latara
        run: python -m latara trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          LATARA_MODE: ${{ vars.LATARA_MODE }}
          LATARA_CONFIRM_LIVE: ${{ vars.LATARA_CONFIRM_LIVE }}
          LATARA_ENABLED: ${{ vars.LATARA_ENABLED }}
          LATARA_MAX_CAPITAL: ${{ vars.LATARA_MAX_CAPITAL }}
          LATARA_MAX_POSITIONS: ${{ vars.LATARA_MAX_POSITIONS }}
          LATARA_DAILY_GOAL: ${{ vars.LATARA_DAILY_GOAL }}
          LATARA_REQUIRE_SPY_GREEN: ${{ vars.LATARA_REQUIRE_SPY_GREEN }}
          LATARA_BREAKEVEN_AT_R: ${{ vars.LATARA_BREAKEVEN_AT_R }}
          LATARA_DRY_RUN: ${{ vars.LATARA_DRY_RUN }}
          LATARA_INTRADAY_FEED: ${{ vars.LATARA_INTRADAY_FEED }}
      - name: Save trade journal
        if: always()
        run: |
          if [ -d journal ] && [ -n "$(git status --porcelain journal)" ]; then
            git config user.name "Latara"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add journal
            git commit -m "Latara trade journal $(date +%F)"
            git pull --rebase && git push
          fi
      - name: Email daily report to you
        if: always() && env.HAS_MAIL == 'true' && hashFiles('logs/report.md') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.LATARA_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.latara.outputs.subject || 'Latara daily report' }}
          to: ${{ secrets.LATARA_EMAIL }}
          from: Latara <${{ secrets.LATARA_EMAIL }}>
          body: file://logs/report.md
          convert_markdown: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latara-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
