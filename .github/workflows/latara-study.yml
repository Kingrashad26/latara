name: Latara – weekly study session

on:
  schedule:
    - cron: "17 14 * * 6"   # Saturday morning (~9am ET)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_MAIL: ${{ secrets.GMAIL_APP_PASSWORD != '' && secrets.LATARA_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Study, replay and learn
        run: python -m latara study
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          LATARA_MODE: ${{ vars.LATARA_MODE }}
          LATARA_CONFIRM_LIVE: ${{ vars.LATARA_CONFIRM_LIVE }}
          LATARA_STARTING_CAPITAL: ${{ vars.LATARA_STARTING_CAPITAL }}
          LATARA_CAPITAL_CEILING: ${{ vars.LATARA_CAPITAL_CEILING }}
          LATARA_MAX_CAPITAL: ${{ vars.LATARA_MAX_CAPITAL }}
      - name: Save what Latara learned
        run: |
          git config user.name "Latara"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latara/brain.json
          git diff --cached --quiet || (git commit -m "Latara weekly study $(date +%F)" && git pull --rebase && git push)
      - name: Email study report to you
        if: always() && env.HAS_MAIL == 'true' && hashFiles('logs/study.md') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.LATARA_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Latara weekly study session
          to: ${{ secrets.LATARA_EMAIL }}
          from: Latara <${{ secrets.LATARA_EMAIL }}>
          body: file://logs/study.md
          convert_markdown: true
